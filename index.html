<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="教育部高級中等學校原住民學生青年領袖培育營南區初階">
  <link rel="shortcut icon" href="images/logo.png" type="image/png">
  <title>教育部高級中等學校原住民學生青年領袖培育營 | 南區初階</title>

  <link rel="stylesheet" type="text/css" href="css/bootstrap.css">
  <link href="css/font-awesome.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">

  <style>
    :root {
      --silc-deep: #27303f;
      --silc-accent: #f6b73c;
      --silc-text: #1f2937;
      --silc-muted: #667085;
      --silc-border: #e5e7eb;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      color: var(--silc-text);
      overflow-x: hidden;
    }

    .site-view[hidden] {
      display: none !important;
    }

    .site-view {
      scroll-margin-top: 24px;
    }

    .hero_area {
      min-height: 100vh;
    }

    body:not(.home-view-active) .hero_area {
      min-height: auto;
      background: var(--silc-deep);
    }

    .custom_nav-container .navbar-nav .nav-item .nav-link {
      cursor: pointer;
    }

    .custom_nav-container .navbar-nav .nav-item .nav-link.active {
      color: var(--silc-accent);
    }

    .hero-title {
      line-height: 1.35;
      margin-bottom: 18px;
    }

    .hero-title small {
      display: block;
      margin-top: 12px;
      font-size: 0.52em;
      color: #ffffff;
    }

    .hero-copy {
      max-width: 860px;
      margin-bottom: 22px;
      color: rgba(255,255,255,0.88);
      line-height: 1.8;
    }

    .btn-box {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 26px;
    }

    .btn-box .btn1 {
      margin: 0;
    }

    .video-frame {
      width: min(100%, 720px);
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 8px;
      background: #111827;
    }

    .content-section {
      padding: 72px 0;
      background: #ffffff;
    }

    .content-section.alt {
      background: #f8fafc;
    }

    .page-heading {
      margin-bottom: 28px;
    }

    .page-heading h2 {
      font-weight: 800;
      color: var(--silc-deep);
    }

    .page-heading p {
      color: var(--silc-muted);
      margin: 8px 0 0;
    }

    .cms-content {
      font-size: 17px;
      line-height: 1.9;
      color: var(--silc-text);
      word-break: break-word;
    }

    .cms-content h3,
    .cms-content h4 {
      margin: 30px 0 14px;
      color: var(--silc-deep);
      font-weight: 800;
      line-height: 1.45;
    }

    .cms-content h3 {
      padding-left: 14px;
      border-left: 5px solid var(--silc-accent);
      font-size: 24px;
    }

    .cms-content h4 {
      font-size: 20px;
    }

    .cms-content p {
      margin: 0 0 18px;
    }

    .cms-content ul,
    .cms-content ol {
      margin: 0 0 20px 1.25rem;
      padding-left: 1.2rem;
    }

    .cms-content li {
      margin-bottom: 8px;
      padding-left: 2px;
    }

    .cms-content a {
      color: #2563eb;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .cms-content blockquote {
      margin: 22px 0;
      padding: 14px 18px;
      border-left: 5px solid var(--silc-accent);
      background: #f8fafc;
      color: var(--silc-muted);
    }

    .cms-content table {
      width: 100%;
      margin: 22px 0;
      border-collapse: collapse;
      background: #ffffff;
    }

    .cms-content th,
    .cms-content td {
      border: 1px solid var(--silc-border);
      padding: 10px 12px;
      vertical-align: top;
    }

    .cms-content th {
      background: #f8fafc;
      color: var(--silc-deep);
      font-weight: 800;
    }

    .cms-content img,
    .notice-card img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .resource-grid,
    .notice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .resource-card,
    .notice-card,
    .empty-card {
      border: 1px solid var(--silc-border);
      border-radius: 8px;
      padding: 18px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    .resource-card h4,
    .notice-card h4 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--silc-deep);
    }

    .resource-card p,
    .notice-card p,
    .empty-card {
      color: var(--silc-muted);
      line-height: 1.7;
    }

    .embed-frame,
    .pdf-frame {
      width: 100%;
      border: 1px solid var(--silc-border);
      border-radius: 8px;
      background: #ffffff;
    }

    .embed-frame {
      min-height: 76vh;
    }

    .pdf-viewer {
      width: 100%;
      border-radius: 8px;
    }

    .pdf-frame {
      display: block;
      height: min(82vh, 920px);
      min-height: 620px;
    }

    .pdf-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .pdf-open-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 14px;
      border-radius: 999px;
      background: var(--silc-deep);
      color: #ffffff;
      font-weight: 700;
    }

    .pdf-open-link:hover {
      color: #ffffff;
      text-decoration: none;
      background: #111827;
    }

    .info_main_row {
      row-gap: 28px;
    }

    .info_col {
      min-width: 0;
    }

    .info_col p {
      margin-bottom: 12px;
    }

    .info-frame {
      display: block;
      width: 100%;
      max-width: 100%;
      border: 0;
      border-radius: 8px;
      background: #ffffff;
    }

    .map-frame {
      height: 220px;
    }

    .facebook-frame {
      max-width: 300px;
      height: 96px;
    }

    .info_contact a {
      align-items: flex-start;
      gap: 8px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .info_contact a i {
      flex: 0 0 auto;
      margin-top: 3px;
    }

    #footerLine img {
      max-width: 100%;
      width: auto;
      max-height: 30px;
      height: auto;
    }

    .api-status {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 999;
      max-width: min(360px, calc(100vw - 32px));
      padding: 12px 14px;
      border-radius: 8px;
      background: rgba(17, 24, 39, 0.9);
      color: #ffffff;
      font-size: 14px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.25);
    }

    .api-status.success {
      background: rgba(22, 101, 52, 0.92);
    }

    .api-status.error {
      background: rgba(185, 28, 28, 0.94);
    }

    @media (max-width: 767px) {
      .hero_area {
        min-height: auto;
      }

      .slider_section {
        padding: 72px 0 48px;
      }

      .hero-title {
        font-size: 34px;
      }

      .content-section {
        padding: 46px 0;
      }

      .btn-box {
        flex-direction: column;
        align-items: stretch;
      }

      .btn-box .btn1 {
        width: 100%;
        text-align: center;
      }

      .pdf-frame {
        height: 72vh;
        min-height: 520px;
      }

      .pdf-actions {
        justify-content: stretch;
      }

      .pdf-open-link {
        width: 100%;
      }

      .info_section,
      .info_section .info_col,
      .info_section .info_form,
      .info_section .info_contact {
        text-align: center;
      }

      .info_col + .info_col {
        margin-top: 10px;
      }

      .map-frame {
        height: 240px;
      }

      .facebook-frame {
        margin-left: auto;
        margin-right: auto;
        height: 105px;
      }

      .info_contact a {
        justify-content: center;
        align-items: center;
      }

      .info_contact a i {
        margin-top: 0;
      }
    }
  </style>
</head>

  <script>
    window.CCSH_API = {
      url: 'https://script.google.com/macros/s/AKfycbwv-pxqk1VQ-i3XZpFMWaLhLOu6ToQTXVIdVPWpbRQpt2Y7ENU76zbukwPMHsySrsFX/exec',
      action: 'getPublicData'
    };

    var PAGE_ORDER = ['home', 'about', 'class', 'news', 'notice', 'reform'];
    var PAGE_LABELS = {
      home: '首頁',
      about: '實施計畫',
      class: '活動課程',
      news: '錄取學員',
      notice: '行前通知',
      reform: '推薦表上傳'
    };

    var HOME_FIXED_TITLE_HTML = '教育部高級中等學校<br>原住民學生青年領袖培育營';
    var HOME_BUTTONS = {
      home_registration_url: { label: '報名學員', fallback: 'https://forms.gle/ZLHPguz724GcdDxP6' },
      home_recommend_upload_url: { label: '推薦表上傳', fallback: 'https://forms.gle/q8PpRCmWxG1i6cWs6' },
      home_admission_pdf_url: { label: '錄取學員', fallback: '#news' },
      home_notice_url: { label: '行前通知', fallback: '#notice' }
    };

    var siteData = {
      settings: {},
      pages: {},
      documents: [],
      forms: [],
      notices: [],
      admissions: [],
      media: []
    };

    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('displayYear').textContent = new Date().getFullYear();
      bindRouting();
      loadPublicData();
    });

    function loadPublicData() {
      setStatus('資料載入中...', '');
      jsonp(window.CCSH_API.url, {
        action: window.CCSH_API.action
      }).then(function (res) {
        if (!res || !res.success) {
          throw new Error((res && res.message) || 'API 回傳失敗');
        }
        siteData = normalizeData(res);
        renderSite(siteData);
        setStatus('已載入最新資料', 'success');
        setTimeout(function () { hideStatus(); }, 1800);
      }).catch(function (err) {
        console.error(err);
        setStatus('資料載入失敗，暫時顯示預設內容。', 'error');
        renderSite(siteData);
      });
    }

    function normalizeData(res) {
      return {
        settings: res.settings || {},
        pages: res.pages || {},
        documents: Array.isArray(res.documents) ? res.documents : [],
        forms: Array.isArray(res.forms) ? res.forms : [],
        notices: Array.isArray(res.notices) ? res.notices : [],
        admissions: Array.isArray(res.admissions) ? res.admissions : [],
        media: Array.isArray(res.media) ? res.media : []
      };
    }

    function renderSite(data) {
      renderSettings(data.settings);
      renderNavigation(data.pages);
      renderHome(data);
      PAGE_ORDER.filter(function (key) { return key !== 'home'; }).forEach(function (key) {
        renderPage(key, data);
      });
      updateActiveView(window.location.hash.replace('#', '') || 'home', false);
      bindRouting();
    }

    function renderSettings(settings) {
      var title = settings.site_title || '教育部高級中等學校原住民學生青年領袖培育營';
      var subtitle = settings.site_subtitle || '南區初階';
      document.title = title + ' | ' + subtitle;
      setAttr('heroImage', 'src', resolveAssetUrl(settings.hero_image_url || 'images/photo.jpg'));
      setAttr('siteLogo', 'src', resolveAssetUrl(settings.logo_url || 'images/logo.png'));
      setContact('footerPhone', 'tel:' + (settings.contact_phone || '08-7882017#307'), settings.contact_phone || '08-7882017#307');
      setContact('footerEmail', 'mailto:' + (settings.contact_email || 'indigenous@apps.ccsh.ptc.edu.tw'), settings.contact_email || 'indigenous@apps.ccsh.ptc.edu.tw');
      setContact('footerSchool', settings.school_url || 'https://www.ccsh.ptc.edu.tw', '國立潮州高中網站');
      setLineAccount(settings.lineid || '');
    }

    function renderNavigation(pages) {
      var nav = document.getElementById('mainNav');
      nav.innerHTML = PAGE_ORDER.map(function (key) {
        var page = pages[key] || {};
        var label = page.nav_label || PAGE_LABELS[key] || key;
        return '<li class="nav-item"><a class="nav-link" href="#' + key + '" data-view-link="' + key + '">' + escapeHtml(label) + '</a></li>';
      }).join('') + '<li class="nav-item"><a class="nav-link" href="info.html">活動登入</a></li>';
    }

    function renderHome(data) {
      var settings = data.settings;
      var page = data.pages.home || {};
      var subtitle = page.subtitle || settings.site_subtitle || '南區初階';
      document.getElementById('homeTitle').innerHTML = HOME_FIXED_TITLE_HTML + '<small id="homeSubtitle">' + escapeHtml(subtitle) + '</small>';
      document.getElementById('homeContent').innerHTML = page.content_html || '';

      var videoUrl = page.embed_type === 'video' && page.embed_url ? page.embed_url : settings.youtube_url;
      if (videoUrl) setAttr('homeVideo', 'src', toEmbedUrl(videoUrl));

      var visibleKeys = String(settings.home_button_visible_keys || 'home_registration_url,home_recommend_upload_url')
        .split(',')
        .map(function (key) { return key.trim(); })
        .filter(Boolean)
        .slice(0, 2);

      document.getElementById('homeButtons').innerHTML = visibleKeys.map(function (key) {
        var meta = HOME_BUTTONS[key];
        if (!meta) return '';
        var url = settings[key] || meta.fallback;
        return renderButton(meta.label, url);
      }).join('');
    }

    function renderPage(key, data) {
      var page = data.pages[key] || {};
      setText(key + 'Title', page.title || PAGE_LABELS[key] || key);
      setText(key + 'Subtitle', page.subtitle || '');
      setHtml(key + 'Content', page.content_html || '');

      if (key === 'about') {
        renderResources('aboutResources', data.documents.filter(function (item) { return item.page_key === 'about'; }), 'document');
        appendForms('aboutResources', data.forms.filter(function (item) { return item.page_key === 'about'; }));
      }

      if (key === 'class') {
        setHtml('classEmbed', renderEmbed(page));
      }

      if (key === 'news') {
        renderAdmissions(data, page);
      }

      if (key === 'notice') {
        renderNotices(data.notices);
      }

      if (key === 'reform') {
        renderResources('reformResources', data.documents.filter(function (item) { return item.page_key === 'reform'; }), 'document');
        appendForms('reformResources', data.forms.filter(function (item) { return item.page_key === 'reform'; }));
        setHtml('reformEmbed', renderEmbed(page));
      }
    }

    function renderAdmissions(data, page) {
      var area = document.getElementById('admissionsArea');
      var activeAdmission = data.admissions[0];
      var pdfUrl = page.embed_url || (activeAdmission && activeAdmission.pdf_url) || data.settings.home_admission_pdf_url || '';
      if (!pdfUrl) {
        area.innerHTML = '<div class="empty-card">尚未發布錄取名單。</div>';
        return;
      }
      area.innerHTML = renderPdfViewer(pdfUrl, '錄取名單');
    }

    function renderNotices(notices) {
      var list = document.getElementById('noticeList');
      if (!notices.length) {
        list.innerHTML = '<div class="empty-card">尚未發布行前通知。</div>';
        return;
      }
      list.innerHTML = notices.map(function (notice) {
        var image = notice.image_url ? '<img src="' + escapeHtml(resolveAssetUrl(notice.image_url)) + '" alt="' + escapeHtml(notice.title || '行前通知') + '">' : '';
        var file = notice.file_url ? '<p>' + renderButton('下載附件', notice.file_url) + '</p>' : '';
        return '<article class="notice-card">' +
          '<h4>' + escapeHtml(notice.title || '行前通知') + '</h4>' +
          image +
          '<div class="cms-content">' + (notice.content_html || '') + '</div>' +
          file +
          '</article>';
      }).join('');
    }

    function renderResources(targetId, items) {
      var target = document.getElementById(targetId);
      target.innerHTML = items.map(function (item) {
        return renderResourceCard(item.title, item.description, item.file_url, item.file_type || '開啟文件');
      }).join('');
    }

    function appendForms(targetId, forms) {
      var target = document.getElementById(targetId);
      target.innerHTML += forms.map(function (form) {
        return renderResourceCard(form.title, '', form.form_url, form.button_label || '開啟表單');
      }).join('');
    }

    function renderResourceCard(title, description, url, label) {
      if (!url) return '';
      return '<article class="resource-card">' +
        '<h4>' + escapeHtml(title || label || '資源連結') + '</h4>' +
        (description ? '<p>' + escapeHtml(description) + '</p>' : '') +
        renderButton(label || '開啟連結', url) +
        '</article>';
    }

    function renderEmbed(page) {
      if (!page || !page.embed_url) return '';
      var url = resolveAssetUrl(page.embed_url);
      if (page.embed_type === 'pdf') {
        return renderPdfViewer(url, page.title || 'PDF 文件');
      }
      if (page.embed_type === 'iframe' || page.embed_type === 'form' || page.embed_type === 'video') {
        return '<iframe class="embed-frame" src="' + escapeHtml(toEmbedUrl(url)) + '" loading="lazy" allowfullscreen></iframe>';
      }
      if (page.embed_type === 'image') {
        return '<img class="img-fluid" src="' + escapeHtml(url) + '" alt="' + escapeHtml(page.title || '') + '">';
      }
      return '';
    }

    function renderPdfViewer(pdfUrl, label) {
      var url = resolveAssetUrl(pdfUrl);
      var safeLabel = escapeHtml(label || 'PDF 文件');
      return '<div class="pdf-viewer">' +
        '<iframe class="pdf-frame" src="' + escapeHtml(url) + '" title="' + safeLabel + '" loading="lazy"></iframe>' +
        '<div class="pdf-actions"><a class="pdf-open-link" href="' + escapeHtml(url) + '" target="_blank" rel="noopener">另開 ' + safeLabel + '</a></div>' +
        '</div>';
    }

    function toAbsoluteUrl(url) {
      if (!url) return '';
      if (url.charAt(0) === '#') return url;
      try {
        return new URL(url, window.location.href).href;
      } catch (err) {
        return url;
      }
    }

    function renderButton(label, url) {
      var href = resolveAssetUrl(url || '#home');
      var internal = href.charAt(0) === '#';
      return '<a class="btn1" href="' + escapeHtml(href) + '"' + (internal ? ' data-view-link="' + escapeHtml(href.slice(1)) + '"' : ' target="_blank" rel="noopener"') + '>' + escapeHtml(label) + '</a>';
    }

    function bindRouting() {
      var links = Array.prototype.slice.call(document.querySelectorAll('[data-view-link]'));
      links.forEach(function (link) {
        if (link.dataset.boundViewLink) return;
        link.dataset.boundViewLink = 'true';
        link.addEventListener('click', function (event) {
          event.preventDefault();
          updateActiveView(link.dataset.viewLink, true);
        });
      });

      if (!window.__ccshHashBound) {
        window.__ccshHashBound = true;
        window.addEventListener('hashchange', function () {
          updateActiveView(window.location.hash.replace('#', '') || 'home', false);
        });
      }
    }

    function updateActiveView(viewName, shouldScroll) {
      var views = Array.prototype.slice.call(document.querySelectorAll('[data-view]'));
      var known = views.map(function (view) { return view.dataset.view; });
      var next = known.indexOf(viewName) >= 0 ? viewName : 'home';
      views.forEach(function (view) {
        view.hidden = view.dataset.view !== next;
      });
      document.querySelectorAll('[data-view-link]').forEach(function (link) {
        link.classList.toggle('active', link.dataset.viewLink === next);
      });
      document.body.classList.toggle('home-view-active', next === 'home');
      if (window.location.hash !== '#' + next) history.replaceState(null, '', '#' + next);
      if (shouldScroll) {
        if (next === 'home') window.scrollTo({ top: 0, behavior: 'smooth' });
        else document.getElementById('view-' + next).scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      if (window.jQuery) $('.navbar-collapse').collapse('hide');
    }

    function jsonp(url, params) {
      return new Promise(function (resolve, reject) {
        var callbackName = 'ccshApiCallback_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
        var script = document.createElement('script');
        var query = Object.keys(params || {}).map(function (key) {
          return encodeURIComponent(key) + '=' + encodeURIComponent(params[key]);
        });
        query.push('callback=' + encodeURIComponent(callbackName));

        window[callbackName] = function (data) {
          cleanup();
          resolve(data);
        };

        script.onerror = function () {
          cleanup();
          reject(new Error('API 載入失敗'));
        };

        script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + query.join('&');
        document.body.appendChild(script);

        function cleanup() {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }
      });
    }

    function toEmbedUrl(url) {
      if (!url) return '';
      var watch = String(url).match(/[?&]v=([^&]+)/);
      if (watch) return 'https://www.youtube.com/embed/' + watch[1];
      return url;
    }

    function resolveAssetUrl(url) {
      if (!url) return '';
      if (/^(https?:)?\/\//.test(url) || url.charAt(0) === '#') return url;
      if (url.charAt(0) === '/') return url.replace(/^\//, '');
      return url;
    }

    function setText(id, value) {
      var el = document.getElementById(id);
      if (el) el.textContent = value || '';
    }

    function setHtml(id, value) {
      var el = document.getElementById(id);
      if (el) el.innerHTML = value || '';
    }

    function setAttr(id, attr, value) {
      var el = document.getElementById(id);
      if (el && value) el.setAttribute(attr, value);
    }

    function setContact(id, href, text) {
      var el = document.getElementById(id);
      if (!el) return;
      el.href = href;
      var span = el.querySelector('span');
      if (span) span.textContent = text;
    }

    function setLineAccount(lineid) {
      var el = document.getElementById('footerLine');
      if (!el) return;
      var value = String(lineid || '').trim();
      if (!value) {
        el.href = '#';
        return;
      }
      el.href = /^https?:\/\//i.test(value) ? value : 'https://line.me/ti/p/' + encodeURIComponent(value);
    }

    function setStatus(message, type) {
      var status = document.getElementById('apiStatus');
      status.hidden = false;
      status.className = 'api-status ' + (type || '');
      status.textContent = message;
    }

    function hideStatus() {
      document.getElementById('apiStatus').hidden = true;
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatTitleLineBreaks(value) {
      return escapeHtml(value).replace(/&lt;br\s*\/?&gt;/gi, '<br>');
    }
  </script>
</body>
</html>
